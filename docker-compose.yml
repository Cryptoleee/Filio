# Alles in Docker op de NAS (Tech Notitie §9).
#
#   docker compose up -d --build                  → app op http://<nas-ip>:3000
#   docker compose --profile proxy up -d --build  → + Caddy met TLS op je domein
#
# Instellingen komen uit .env (zie DEPLOY.md).
# Backup: alleen ./data/db hoeft een dump — proxies zijn wegwerpbaar,
# originelen zitten al in Immich.
services:
  web:
    build: .
    restart: unless-stopped
    command: sh -c "node scripts/migrate.mjs && node scripts/seed.mjs && npm run start"
    ports:
      - '3000:3000'
    environment: &appenv
      DATABASE_URL: postgresql://filio:${DB_PASSWORD:-filio}@db:5432/filio
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?zet SESSION_SECRET in .env}
      PROXY_DIR: /proxies
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      EDITOR_EMAIL: ${EDITOR_EMAIL:-editor@example.com}
      EDITOR_PASSWORD: ${EDITOR_PASSWORD:?zet EDITOR_PASSWORD in .env}
      EDITOR_NAME: ${EDITOR_NAME:-Editor}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./data/proxies:/proxies
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: npm run worker
    environment: *appenv
    volumes:
      - ./data/proxies:/proxies
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: filio
      POSTGRES_USER: filio
      POSTGRES_PASSWORD: ${DB_PASSWORD:-filio}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U filio -d filio']
      interval: 5s
      timeout: 3s
      retries: 30

  # Alleen nodig zodra je de app via je eigen domein openbaar maakt (stap 6 in
  # DEPLOY.md). Caddy regelt de TLS-certificaten automatisch.
  caddy:
    image: caddy:2
    profiles: [proxy]
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      REVIEW_DOMAIN: ${REVIEW_DOMAIN:-review.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  caddy-data:
